<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 610" width="720" height="610" font-family="Helvetica, Arial, sans-serif">
  <!-- Touch map for CrossPoint on the Kindle Paperwhite 3, held upright.
       Screen 1072x1448 drawn at 300x405; strips are 1/12 of the height,
       columns are thirds of the width; the menus' Back strip is 10%. -->
  <rect width="720" height="610" fill="#ffffff"/>

  <!-- ===== Reading a book ===== -->
  <text x="190" y="34" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Reading a book</text>
  <g stroke="#374151" stroke-width="1">
    <!-- top strip -->
    <rect x="40" y="50" width="100" height="34" fill="#dbeafe"/>
    <rect x="140" y="50" width="100" height="34" fill="#fde68a"/>
    <rect x="240" y="50" width="100" height="34" fill="#dcfce7"/>
    <!-- page -->
    <rect x="40" y="84" width="100" height="337" fill="#dbeafe"/>
    <rect x="140" y="84" width="200" height="337" fill="#dcfce7"/>
    <!-- bottom strip -->
    <rect x="40" y="421" width="100" height="34" fill="#dbeafe"/>
    <rect x="140" y="421" width="100" height="34" fill="#ddd6fe"/>
    <rect x="240" y="421" width="100" height="34" fill="#dcfce7"/>
  </g>
  <rect x="40" y="50" width="300" height="405" fill="none" stroke="#111827" stroke-width="3" rx="4"/>
  <g fill="#111827" text-anchor="middle">
    <text x="190" y="72" font-size="13" font-weight="bold">Light</text>
    <text x="90" y="250" font-size="15" font-weight="bold">Previous</text>
    <text x="90" y="268" font-size="15" font-weight="bold">page</text>
    <text x="240" y="250" font-size="15" font-weight="bold">Next</text>
    <text x="240" y="268" font-size="15" font-weight="bold">page</text>
    <text x="190" y="443" font-size="13" font-weight="bold">Menu</text>
  </g>
  <g fill="#4b5563" font-size="11" text-anchor="middle">
    <text x="90" y="71">prev</text>
    <text x="290" y="71">next</text>
    <text x="90" y="442">prev</text>
    <text x="290" y="442">next</text>
  </g>

  <!-- ===== Menus and lists ===== -->
  <text x="530" y="34" font-size="18" font-weight="bold" fill="#111827" text-anchor="middle">Menus and lists</text>
  <g stroke="#374151" stroke-width="1">
    <!-- top strip: header back arrow on the left, light in the centre -->
    <rect x="380" y="50" width="100" height="34" fill="#f3f4f6"/>
    <rect x="480" y="50" width="100" height="34" fill="#fde68a"/>
    <rect x="580" y="50" width="100" height="34" fill="#f3f4f6"/>
    <rect x="384" y="54" width="44" height="26" fill="#fecaca" rx="3"/>
    <!-- left Back strip (10% of the width) -->
    <rect x="380" y="84" width="30" height="371" fill="#fecaca"/>
    <!-- list rows -->
    <rect x="410" y="84" width="270" height="371" fill="#f3f4f6"/>
  </g>
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="420" y1="130" x2="670" y2="130"/>
    <line x1="420" y1="176" x2="670" y2="176"/>
    <line x1="420" y1="222" x2="670" y2="222"/>
    <line x1="420" y1="268" x2="670" y2="268"/>
    <line x1="420" y1="314" x2="670" y2="314"/>
    <line x1="420" y1="360" x2="670" y2="360"/>
  </g>
  <rect x="380" y="50" width="300" height="405" fill="none" stroke="#111827" stroke-width="3" rx="4"/>
  <g fill="#111827" text-anchor="middle">
    <text x="406" y="72" font-size="15" font-weight="bold">←</text>
    <text x="530" y="72" font-size="13" font-weight="bold">Light</text>
    <text x="545" y="242" font-size="15" font-weight="bold">Tap a row</text>
    <text x="545" y="259" font-size="12" fill="#4b5563">swipe up / down to scroll</text>
    <text transform="translate(400 270) rotate(-90)" font-size="13" font-weight="bold">Back</text>
  </g>

  <!-- ===== Anywhere ===== -->
  <text x="40" y="492" font-size="15" font-weight="bold" fill="#111827">Anywhere</text>
  <g font-size="13" fill="#111827">
    <text x="40" y="516"><tspan font-weight="bold">Two-finger tap:</tspan> Home</text>
    <text x="40" y="537"><tspan font-weight="bold">Home → Exit CrossPoint…:</tspan> leave (asks first)</text>
    <text x="40" y="558"><tspan font-weight="bold">Power button or cover:</tspan> sleep / wake</text>
    <text x="380" y="516"><tspan font-weight="bold">Swipe left / right:</tspan> next / previous page (reading)</text>
    <text x="380" y="537"><tspan font-weight="bold">Pull down from the top:</tspan> light</text>
    <text x="380" y="558"><tspan font-weight="bold">Swipe up from the bottom:</tspan> reader menu</text>
  </g>
  <text x="40" y="592" font-size="11" fill="#4b5563">Strips are 1/12 of the screen height. Long press selects text, as in stock CrossPoint.</text>
</svg>
