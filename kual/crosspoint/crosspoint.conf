# CrossPoint Reader for Kindle - optional settings.
# Lines are "NAME=value"; delete the leading # to turn a setting on.

# Interface size in percent (100-200): text, menus and tap targets together.
# Default: 125 on the Paperwhite 3, 200 on the Scribe (the same layout as the
# PW3, just bigger). 136 on the PW3 matches the Xteink X4's physical size.
# Higher = bigger and slightly softer, since the picture is scaled up.
#CPK_ZOOM=125

# Folder CrossPoint treats as its SD card. Books can be anywhere inside it.
#CROSSPOINT_SIM_SD=/mnt/us

# Waveform for page turns and menus: GL16 (default), REAGL, DU, A2, GC16, AUTO.
# DU/A2 are faster but drop grays and ghost more.
#CPK_FAST_WAVEFORM=GL16

# Touch fixes, only if taps land in the wrong place (0 or 1).
#CPK_TOUCH_SWAP_XY=0
#CPK_TOUCH_MIRROR_X=0
#CPK_TOUCH_MIRROR_Y=0
# Force a specific input device instead of auto-detection.
#CPK_TOUCH_DEVICE=/dev/input/event1

# Log every touch release (start/end point) to the log file.
#CPK_DEBUG_TOUCH=1

# Port for the Wi-Fi file transfer page (WebSocket uses the next port).
#CROSSPOINT_SIM_HTTP_PORT=80

# Leave Wi-Fi on while CrossPoint runs (1). By default the radio is off and
# only turned on for the file transfer screen, to save battery.
#CPK_KEEP_WIFI=0

# Power log: one line a minute in crosspoint.log (battery, CPU use, wakeups).
# Set to 0 to turn it off.
#CPK_POWER_LOG=1
